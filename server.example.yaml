host: 127.0.0.1
port: 8000
environment: development
allowed_hosts:
  - 127.0.0.1
  - localhost
database_path: data/monitor.db
secure_cookies: false
trust_proxy_headers: false
require_secure_transport: false

# Development defaults only. Copy this file to server.yaml and replace every
# value below before exposing the server to a network.
admin_token: change-me-admin-token
admin_username: admin

# Generate hashes with:
# .\.venv\Scripts\python.exe -m server.monitor_server --hash-secret "your-password-or-token"
admin_password_hash: change-me-admin-password-hash
session_secret: change-me-random-session-secret
session_ttl_hours: 12

users:
  - username: admin
    password_hash: change-me-admin-password-hash
    role: admin
    enabled: true

roles:
  viewer:
    - nodes:read
    - containers:read
    - metrics:read
    - commands:read
    - audit:read
  operator:
    - nodes:read
    - containers:read
    - metrics:read
    - commands:read
    - commands:create
    - audit:read
  admin:
    - "*"

api_tokens:
  - name: automation-token-1
    token_hash: change-me-api-token-hash
    scopes:
      - nodes:read
      - containers:read
    expires_at: 2026-12-31T00:00:00Z
    enabled: false

agents:
  - node_id: dev-agent
    name: dev-agent
    token_id: token-2026-05
    token_hash: change-me-agent-token-hash
    enabled: true

auth_rate_limit:
  window_seconds: 60
  login_max_failures: 8
  ws_max_failures: 20

agent_payload_limits:
  max_containers: 1000
  max_result_message_bytes: 4096
  max_string_length: 256
  max_ports_entries: 64

command:
  timeout_seconds: 60

retention:
  raw_metrics_days: 7
  hourly_rollup_days: 90
  daily_rollup_days: 365
  rollup_interval_seconds: 3600

heartbeat:
  warning_after_seconds: 30
  offline_after_seconds: 60
